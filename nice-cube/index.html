<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="나이스 큐브">
<meta name="theme-color" content="#e9e4ff">
<title>나이스 큐브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg-top: #e9e4ff;
    --bg-bottom: #ffe3ef;
    --ink: #2b2450;
    --ink-soft: #6b6494;
    --panel: rgba(255,255,255,.62);
    --panel-edge: rgba(255,255,255,.9);
    --accent: #5b43e8;
    --shadow: rgba(60,40,140,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #1b1740;
      --bg-bottom: #35153a;
      --ink: #f1ecff;
      --ink-soft: #b3a9de;
      --panel: rgba(30,24,70,.62);
      --panel-edge: rgba(255,255,255,.14);
      --accent: #9a86ff;
      --shadow: rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1b1740;
    --bg-bottom: #35153a;
    --ink: #f1ecff;
    --ink-soft: #b3a9de;
    --panel: rgba(30,24,70,.62);
    --panel-edge: rgba(255,255,255,.14);
    --accent: #9a86ff;
    --shadow: rgba(0,0,0,.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(170deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage.grabbing { cursor: grabbing; }

  header {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 22px 0;
    pointer-events: none;
  }
  h1 { margin: 0; font-weight: 600; font-size: clamp(26px, 6vw, 40px); letter-spacing: -.02em; }
  header p { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; }

  #panel {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0;
    width: min(560px, calc(100% - 24px));
    margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding: 14px 16px 16px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 26px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 34px var(--shadow);
    display: grid; gap: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .swatches { display: flex; gap: 8px; }
  .sw {
    width: 30px; height: 30px; border-radius: 11px; border: 2px solid transparent; padding: 0; cursor: pointer;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,.14), inset 0 4px 8px rgba(255,255,255,.55);
  }
  .sw[aria-pressed="true"] { border-color: var(--ink); transform: scale(1.1); }
  .seg { display: flex; background: rgba(120,110,190,.16); border-radius: 14px; padding: 3px; }
  .seg button {
    font: inherit; font-size: 15px; color: var(--ink-soft); background: none; border: 0; padding: 7px 12px; border-radius: 11px; cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .iconbtn {
    font: inherit; font-size: 15px; color: var(--ink); background: rgba(120,110,190,.16); border: 0; border-radius: 14px; padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  label.sl { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-soft); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .iconbtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #hint { padding: 0 20px; box-sizing: border-box;
    position: fixed; left: 0; right: 0; top: 92px;
    text-align: center; color: var(--ink-soft); font-size: 15px; pointer-events: none;
    transition: opacity .6s; opacity: 0;
  }
  @media (max-height: 640px) { header p { display: none; } }
  html, body { overscroll-behavior: none; position: fixed; inset: 0; }
  body { -webkit-touch-callout: none; -webkit-user-select: none; }
  #more { display: grid; gap: 12px; }
  #more[hidden] { display: none; }
  #panel .row { row-gap: 8px; }
  @media (pointer: coarse) {
    .seg button, .iconbtn { min-height: 40px; }
    .sw { width: 34px; height: 34px; }
    #panel { padding: 10px 12px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D 말랑이 큐브. 눌러서 만져보세요."></canvas>

<header>
  <h1>나이스 큐브</h1>
  <p>바닥에 놓인 큐브를 꾹 눌러 보세요</p>
</header>

<div id="panel">
  <div class="row">
    <div class="seg" role="group" aria-label="만지는 방식">
      <button id="modePress" aria-pressed="true">누르기</button>
      <button id="modePull" aria-pressed="false">당기기</button>
      <button id="modeBubble" aria-pressed="false" hidden>바풍</button>
    </div>
    <button id="glassBtn" class="iconbtn" aria-label="질감 바꾸기">질감: 젤리</button>
    <button id="moreBtn" class="iconbtn" aria-expanded="true" aria-controls="more">설정 접기</button>
  </div>
  <div id="more">
    <div class="row">
      <div class="swatches" id="swatches" role="group" aria-label="색상"></div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="로고">
        <button id="logoRaised" aria-pressed="true">양각</button>
        <button id="logoEngraved" aria-pressed="false">음각</button>
        <button id="logoNone" aria-pressed="false">로고 없음</button>
      </div>
      <button id="glitter" class="iconbtn" aria-pressed="false">반짝이 끔</button>
      <button id="mute" class="iconbtn" aria-label="소리 종류 바꾸기">소리: 질척</button>
    </div>
    <label class="sl">로고 글씨
      <input id="logoText" type="text" maxlength="14" value="NICE CUBE" aria-label="로고 글씨" style="font:inherit;font-size:16px;padding:7px 10px;border-radius:12px;border:1px solid var(--panel-edge);background:rgba(120,110,190,.12);color:var(--ink);width:100%;min-width:0">
    </label>
    <label class="sl">쫀득함
      <input id="recover" type="range" min="0.8" max="9" step="0.1" value="1.7" aria-label="복원 속도. 왼쪽일수록 천천히 돌아옴">
    </label>
    <label class="sl">누르는 힘
      <input id="depth" type="range" min="0.2" max="0.85" step="0.01" value="0.62" aria-label="눌림 깊이">
    </label>
  </div>
</div>
<div id="hint">큐브를 눌러 보세요. 빈 곳을 끌면 돌려 볼 수 있어요.<br>트랙패드에서 두 손가락을 벌리면 늘어나요. 물슬라임은 '바풍'으로 공기 풍선을 만들어요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 기본 설정 ---------- */
  var canvas = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.toneMappingExposure = 1.0;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 50);
  camera.position.set(0, 1.5, 3.9);
  camera.lookAt(0, -0.18, 0);

  /* ---------- 환경맵 (소프트박스 느낌의 하이라이트) ---------- */
  (function makeEnv() {
    var c = document.createElement("canvas");
    c.width = 512; c.height = 256;
    var g = c.getContext("2d");
    var grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, "#9fb0ff");
    grad.addColorStop(0.5, "#4a4478");
    grad.addColorStop(1, "#1d1a3a");
    g.fillStyle = grad; g.fillRect(0, 0, 512, 256);
    g.fillStyle = "rgba(255,255,255,0.95)";
    g.fillRect(50, 36, 110, 70);
    g.fillRect(290, 28, 150, 50);
    g.fillRect(200, 150, 40, 30);
    g.fillStyle = "rgba(255,240,250,0.6)";
    g.fillRect(190, 120, 60, 40);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.mapping = THREE.EquirectangularReflectionMapping;
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(tex).texture;
    pm.dispose();
  })();

  var key = new THREE.DirectionalLight(0xffffff, 0.6);
  key.position.set(2.5, 4, 3);
  scene.add(key);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a8fd0, 0.3));

  /* ---------- 둥근 큐브 지오메트리 ---------- */
  var IS_MOBILE = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  var SEG = IS_MOBILE ? 22 : 30, HALF = 0.5, R = 0.22;      // 휴대폰은 계산량을 줄임
  var geo = new THREE.BoxGeometry(1, 1, 1, SEG, SEG, SEG);
  var pos = geo.attributes.position;
  var N = pos.count;
  var rest = new Float32Array(N * 3);
  var restN = new Float32Array(N * 3);

  (function roundCube() {
    var inner = HALF - R, v = new THREE.Vector3(), c = new THREE.Vector3(), d = new THREE.Vector3();
    for (var i = 0; i < N; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i));
      c.set(
        Math.max(-inner, Math.min(inner, v.x)),
        Math.max(-inner, Math.min(inner, v.y)),
        Math.max(-inner, Math.min(inner, v.z))
      );
      d.copy(v).sub(c);
      if (d.lengthSq() < 1e-12) { d.copy(v).normalize(); }
      d.normalize();
      v.copy(c).addScaledVector(d, R);
      // 구에 살짝 가깝게 (젤리처럼 통통하게)
      var rl = v.length();
      v.multiplyScalar(1 - 0.1 + 0.1 * (0.6 / rl));
      // 아래쪽이 자중으로 살짝 퍼진 느낌
      var sag = 1 + 0.07 * (0.5 - v.y);
      v.x *= sag; v.z *= sag;
      // 완벽한 큐브가 아닌 미세한 울퉁불퉁함
      var lump = 0.014 * Math.sin(v.x * 7.0 + v.y * 3.0) * Math.cos(v.z * 6.0 + v.x * 2.0)
               + 0.01 * Math.sin(v.y * 9.0 + v.z * 5.0);
      v.addScaledVector(d, lump);
      pos.setXYZ(i, v.x, v.y, v.z);
      rest[i * 3] = v.x; rest[i * 3 + 1] = v.y; rest[i * 3 + 2] = v.z;
      restN[i * 3] = d.x; restN[i * 3 + 1] = d.y; restN[i * 3 + 2] = d.z;
    }
  })();

  geo.setAttribute("aRest", new THREE.BufferAttribute(rest, 3));

  // 면 경계에서 겹치는 점을 하나로 묶어, 눌렸을 때 이음새가 보이지 않게 법선을 직접 계산
  var weld = new Int32Array(N);
  var weldCount = 0;
  (function buildWeld() {
    var map = {};
    for (var i = 0; i < N; i++) {
      var k = Math.round(rest[i * 3] * 5000) + "_" + Math.round(rest[i * 3 + 1] * 5000) + "_" + Math.round(rest[i * 3 + 2] * 5000);
      if (map[k] === undefined) map[k] = weldCount++;
      weld[i] = map[k];
    }
  })();
  var idx = geo.index.array;
  var nrm = geo.attributes.normal;
  var accum = new Float32Array(weldCount * 3);

  function recomputeNormals() {
    accum.fill(0);
    var p = pos.array;
    for (var t = 0; t < idx.length; t += 3) {
      var a = idx[t], b = idx[t + 1], c = idx[t + 2];
      var ax = p[a * 3], ay = p[a * 3 + 1], az = p[a * 3 + 2];
      var e1x = p[b * 3] - ax, e1y = p[b * 3 + 1] - ay, e1z = p[b * 3 + 2] - az;
      var e2x = p[c * 3] - ax, e2y = p[c * 3 + 1] - ay, e2z = p[c * 3 + 2] - az;
      var nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
      var wa = weld[a] * 3, wb = weld[b] * 3, wc = weld[c] * 3;
      accum[wa] += nx; accum[wa + 1] += ny; accum[wa + 2] += nz;
      accum[wb] += nx; accum[wb + 1] += ny; accum[wb + 2] += nz;
      accum[wc] += nx; accum[wc + 1] += ny; accum[wc + 2] += nz;
    }
    var n = nrm.array;
    for (var i = 0; i < N; i++) {
      var w = weld[i] * 3;
      var x = accum[w], y = accum[w + 1], z = accum[w + 2];
      var l = Math.sqrt(x * x + y * y + z * z) || 1;
      n[i * 3] = x / l; n[i * 3 + 1] = y / l; n[i * 3 + 2] = z / l;
    }
    nrm.needsUpdate = true;
  }

  /* ---------- 재질 ---------- */
  var COLORS = [
    { name: "블루", hex: "#4aa8ff" },
    { name: "쿨핑크", hex: "#fb6cc2" },
    { name: "라임", hex: "#9be04a" },
    { name: "오렌지", hex: "#ff9d3d" },
    { name: "퍼플", hex: "#9b6bff" },
    { name: "민트", hex: "#3fd9b5" }
  ];
  function backColor(hex) { return new THREE.Color(hex).offsetHSL(0, 0.18, -0.06); }

  var NOISE_GLSL = [
    "varying vec3 vRest;",
    "uniform float uGlitter;",
    "uniform float uGlass;",
    "uniform float uPudding;",
    "uniform float uWater;",
    "uniform float uCloud;",
    "varying float vPress;",
    "uniform float uTime;",
    "float hash3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }",
    "float vnoise(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);",
    " return mix(mix(mix(hash3(i), hash3(i+vec3(1,0,0)), f.x), mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)), f.x), f.y),",
    "            mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)), f.x), mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)), f.x), f.y), f.z); }",
    // 반짝이 조각: 작은 격자 칸마다 무작위 방향의 조각이 있고, 보는 각도와 시간에 따라 반짝임
    "vec3 flakes3(vec3 pr, vec3 vdir, float scale, float thr, float t, float far){",
    // 반짝이: 평소엔 은은한 금속 조각, 빛 각도가 맞는 순간 강하게 번쩍이며 십자 빛줄기가 생김
    "  vec3 a = abs(pr); vec2 uv; float ax;",
    "  if (a.x >= a.y && a.x >= a.z) { uv = pr.yz; ax = 0.0; } else if (a.y >= a.z) { uv = pr.xz; ax = 1.0; } else { uv = pr.xy; ax = 2.0; }",
    "  vec2 gp = uv * scale; vec2 gi = floor(gp); vec2 gf = fract(gp) - 0.5;",
    "  vec3 hs = vec3(gi, ax);",
    "  float h = hash3(hs); if (h < thr) return vec3(0.0);",
    "  gf -= (vec2(hash3(hs + 7.7), hash3(hs + 8.8)) - 0.5) * 0.3;",
    "  float ang = hash3(hs + 3.1) * 6.2832; float ca = cos(ang), sa = sin(ang);",
    "  vec2 q = vec2(ca * gf.x - sa * gf.y, sa * gf.x + ca * gf.y);",
    "  float hexd = max(abs(q.y), abs(q.x) * 0.866 + abs(q.y) * 0.5);",
    "  float body = 1.0 - smoothstep(0.12 - 0.02 * far, 0.15 + 0.05 * far, hexd);",
    "  vec3 fn = normalize(vec3(hash3(hs + 1.7), hash3(hs + 5.3), hash3(hs + 9.1)) - 0.5 + vec3(0.0001));",
    "  vec3 Lh = normalize(normalize(vec3(0.4, 0.75, 0.55)) + vdir);",
    "  float spec = pow(abs(dot(fn, Lh)), 48.0);",
    "  float tw = pow(0.5 + 0.5 * sin(t * 2.6 + h * 70.0), 6.0);",
    "  float flash = clamp(spec + tw * 0.85, 0.0, 1.6);",
    "  vec3 iri = 0.62 + 0.38 * cos(6.2832 * (h * 3.0 + dot(fn, vdir) * 0.8 + vec3(0.0, 0.33, 0.67)));",
    "  vec3 col = body * (iri * 0.28 + vec3(1.0) * flash * 1.5);",
    "  float r2 = dot(gf, gf);",
    "  float glow = exp(-r2 * 60.0) * flash;",
    "  float cross = (exp(-abs(gf.x) * 45.0) * exp(-abs(gf.y) * 7.0) + exp(-abs(gf.y) * 45.0) * exp(-abs(gf.x) * 7.0)) * flash;",
    "  return col + mix(vec3(1.0), iri, 0.25) * (glow * 0.7 * (1.0 - 0.4 * far) + cross * 0.85 * (1.0 - 0.85 * far));",
    "}"
  ].join("\n");
  var glassU = { value: 0 }, puddingU = { value: 0 }, waterU = { value: 0 }, cloudU = { value: 0 };
  var glitterU = { value: 0 }, timeU = { value: 0 };
  function patchVertex(sh) {
    sh.vertexShader = sh.vertexShader
      .replace("void main() {", "attribute vec3 aRest;\nattribute float aPress;\nvarying vec3 vRest;\nvarying float vPress;\nvarying vec3 vTX;\nvarying vec3 vTY;\nvoid main() {")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvRest = aRest;\nvPress = aPress;\nvTX = normalize(normalMatrix * vec3(1.0, 0.0, 0.0));\nvTY = normalize(normalMatrix * vec3(0.0, 1.0, 0.0));");
  }

  /* 안쪽 슬라임: 맑고 선명한 색. 가운데는 빛이 통과해 밝고, 가장자리는 두꺼워서 진함 */
  var backMat = new THREE.MeshPhysicalMaterial({
    color: backColor(COLORS[0].hex),
    roughness: 0.7,
    metalness: 0,
    side: THREE.BackSide,
    transparent: true,
    opacity: 0.96,
    depthWrite: false
  });
  backMat.onBeforeCompile = function (sh) {
    sh.uniforms.uGlitter = glitterU;
    sh.uniforms.uGlass = glassU;
    sh.uniforms.uPudding = puddingU;
    sh.uniforms.uWater = waterU;
    sh.uniforms.uCloud = cloudU;
    sh.uniforms.uTime = timeU;
    patchVertex(sh);
    var f = sh.fragmentShader.replace("void main() {", NOISE_GLSL + "\nvoid main() {");
    f = f.replace("#include <color_fragment>",
      "#include <color_fragment>\n" +
      "float ndv = clamp(abs(dot(normalize(vNormal), normalize(vViewPosition))), 0.0, 1.0);\n" +
      "float core = pow(ndv, 1.1);\n" +
      "float cz = vnoise(vRest * 2.6 + 3.0) * 0.6 + vnoise(vRest * 5.5) * 0.4;\n" +
      "vec3 baseC = diffuseColor.rgb;\n" +
      "vec3 deepC = diffuseColor.rgb * 0.36;\n" +
      "vec3 lightC = diffuseColor.rgb * 1.0;\n" +
      "diffuseColor.rgb = mix(deepC, lightC, core) * (0.86 + 0.32 * cz);\nfloat edgeG = pow(1.0 - core, 1.6);\nvec3 glassC = mix(baseC * 0.95, baseC * 0.62, edgeG);\ndiffuseColor.rgb = mix(diffuseColor.rgb, glassC, uGlass);\ndiffuseColor.a *= mix(1.0, clamp(0.2 + 0.55 * edgeG, 0.0, 1.0), uGlass);\ndiffuseColor.rgb = mix(diffuseColor.rgb, mix(baseC, vec3(1.0), 0.12) * (0.8 + 0.28 * core), uPudding);\ndiffuseColor.a = mix(diffuseColor.a, 0.97, uPudding);\nvec3 waterC = mix(mix(baseC * 0.92, baseC * 0.7, edgeG), vec3(1.0), 0.35 * uCloud);\ndiffuseColor.rgb = mix(diffuseColor.rgb, waterC, uWater);\ndiffuseColor.a = mix(diffuseColor.a, clamp(0.05 + 0.4 * edgeG + 0.3 * uCloud - 0.5 * max(-vPress, 0.0), 0.0, 1.0), uWater);");

      var bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 300; bp.Q.value = 1.6;
      var lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1100;
      var g = actx.createGain(); g.gain.value = 0;
      src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(actx.destination);
      src.start();
      sq = { bp: bp, g: g };
    } catch (e) { actx = null; }
  }
  function burst(freq, q, dur, gain) {
    var t = actx.currentTime;
    var s = actx.createBufferSource(); s.buffer = noiseBuf;
    var f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(actx.destination);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function pop(f0, f1, dur, gain) {
    var t = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function playPress(depth) {
    if (!actx || soundMode === "off") return;
    if (soundMode === "wet") burst(240, 1.2, 0.12, 0.1);
    else pop(330, 190, 0.05, 0.07);
  }
  function playRelease(depth) {
    if (!actx || soundMode === "off") return;
    if (soundMode === "wet") { burst(420, 1.4, 0.1, 0.07); }
    else pop(210, 360, 0.05, 0.06);
  }
  // 매 프레임: 변형 속도에 따라 질척 소리 크기·음색 조절
  function updateSound(dt) {
    if (!actx || !sq) return;
    var now = actx.currentTime;
    var on = soundMode === "wet";
    var v = Math.min(1, speed * 9);
    sq.g.gain.setTargetAtTime(on ? v * 0.5 : 0, now, 0.04);
    sq.bp.frequency.setTargetAtTime(220 + v * 520, now, 0.05);
    if (on && v > 0.12 && Math.random() < dt * 22 * v) {
      var f = 130 + Math.random() * 170;
      pop(f, f * (1.5 + Math.random() * 0.7), 0.045 + Math.random() * 0.04, 0.03 + 0.05 * v);
    }
  }

  /* ---------- UI ---------- */
  var swWrap = document.getElementById("swatches");
  COLORS.forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "sw";
    b.style.background = c.hex;
    b.setAttribute("aria-label", c.name);
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", function () {
      frontTint.value.set(c.hex);
      backMat.color.copy(backColor(c.hex));
      glow.material.color.set(c.hex);
      Array.prototype.forEach.call(swWrap.children, function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
    });
    swWrap.appendChild(b);
  });

  var bPress = document.getElementById("modePress"), bPull = document.getElementById("modePull"), bBubble = document.getElementById("modeBubble");
  function setMode(m) {
    mode = m;
    bPress.setAttribute("aria-pressed", m === "press");
    bPull.setAttribute("aria-pressed", m === "pull");
    bBubble.setAttribute("aria-pressed", m === "bubble");
  }
  bBubble.addEventListener("click", function () { setMode("bubble"); });
  bPress.addEventListener("click", function () { setMode("press"); });
  bPull.addEventListener("click", function () { setMode("pull"); });

  document.getElementById("recover").addEventListener("input", function (e) { params.recover = parseFloat(e.target.value); });
  document.getElementById("depth").addEventListener("input", function (e) { params.depth = parseFloat(e.target.value); });

  // 로고: 양각 / 음각 / 없음
  var logoBtns = { raised: document.getElementById("logoRaised"), engraved: document.getElementById("logoEngraved"), none: document.getElementById("logoNone") };
  function setLogo(kind) {
    embossU.value = kind === "raised" ? 1 : kind === "engraved" ? -1 : 0;
    Object.keys(logoBtns).forEach(function (k) { logoBtns[k].setAttribute("aria-pressed", k === kind); });
  }
  logoBtns.raised.addEventListener("click", function () { setLogo("raised"); });
  logoBtns.engraved.addEventListener("click", function () { setLogo("engraved"); });
  logoBtns.none.addEventListener("click", function () { setLogo("none"); });
  document.getElementById("logoText").addEventListener("input", function (e) { logoText = e.target.value; drawLogo(); });

  // 반짝이
  // 질감: 젤리 → 유리 → 푸딩
  var glassBtn = document.getElementById("glassBtn");
  var TEXTURES = ["젤리", "유리", "푸딩", "물슬라임"], texIdx = 0;
  function setTexture(i) {
    texIdx = i;
    var glass = i === 1, pud = i === 2, wat = i === 3;
    glassU.value = glass ? 1 : 0; puddingU.value = pud ? 1 : 0; waterU.value = wat ? 1 : 0;
    mat.roughness = glass ? 0.04 : pud ? 0.1 : wat ? 0.05 : 0.16;
    mat.clearcoat = glass ? 0.6 : pud ? 1.0 : wat ? 0.7 : 0.65;
    mat.clearcoatRoughness = glass ? 0.03 : pud ? 0.06 : wat ? 0.02 : 0.15;
    mat.envMapIntensity = glass ? 0.25 : pud ? 0.55 : wat ? 0.28 : 0.5;
    if (wat && mbs.length < 25) for (var b0 = 0; b0 < 25; b0++) mbSpawn((Math.random() - 0.5) * 0.8, restMinY + Math.random() * 0.8, (Math.random() - 0.5) * 0.8);
    if (!wat) domes.length = 0;
    bBubble.hidden = !wat; if (!wat && mode === "bubble") setMode("press");
    if (typeof glow !== "undefined") glow.material.opacity = (glass || wat) ? 0.8 : 0.55;
    glassBtn.textContent = "질감: " + TEXTURES[i];
  }
  glassBtn.addEventListener("click", function () {
    setTexture((texIdx + 1) % TEXTURES.length);
    if (texIdx === 2) startShake();   // 푸딩으로 바꾸는 순간(탭 안에서) 동작 센서 권한을 요청해야 아이폰에서 허용 창이 뜸
  });

  /* ---------- 폰 흔들기: 푸딩일 때 폰을 흔들면 큐브가 관성으로 출렁임 ---------- */
  var shake = { on: false, t: 0 }, _shV = new THREE.Vector3(), _shQ = new THREE.Quaternion();
  function startShake() {
    if (shake.on || !IS_MOBILE || !window.DeviceMotionEvent) return;
    var DME = window.DeviceMotionEvent;
    if (typeof DME.requestPermission === "function") {         // iOS 13+: 사용자 탭 안에서 권한 요청 필요
      DME.requestPermission().then(function (r) {
        if (r === "granted") listenShake();
        else shakeMsg("폰 흔들기를 쓰려면 '동작 및 방향' 접근을 허용해 주세요.<br>사파리를 완전히 닫았다 다시 열면 다시 물어봐요.");
      }).catch(function () { shakeMsg("이 브라우저에서는 폰 흔들기를 쓸 수 없어요."); });
    } else listenShake();                                       // 안드로이드 등은 권한 없이 바로 받음
  }
  function listenShake() {
    shake.on = true;
    window.addEventListener("devicemotion", onShake);
    shakeMsg("폰을 흔들어 보세요. 푸딩이 출렁여요.");
  }
  function shakeMsg(html) {
    hint.innerHTML = html; hint.style.opacity = 1;
    clearTimeout(shake.msgT); shake.msgT = setTimeout(function () { hint.style.opacity = 0; }, 3500);
  }
  function onShake(e) {
    if (puddingU.value !== 1 || held || pinch.active) return;   // 푸딩일 때만, 만지는 중에는 손 입력을 우선
    var a = e.acceleration;                                     // 중력을 뺀 가속도(m/s²)
    if (!a || a.x == null) return;
    var now = performance.now(), dt = Math.min(0.05, (now - (shake.t || now)) / 1000); shake.t = now;
    if (!dt) return;
    // 기기 축 → 화면 축 (가로로 돌려 들었을 때 보정)
    var ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
    var c = Math.cos(ang), s = Math.sin(ang);
    var sx = c * a.x - s * a.y, sy = s * a.x + c * a.y, sz = a.z;
    var dead = 1.2;                                             // 손떨림 정도는 무시
    function cut(v) { return Math.abs(v) < dead ? 0 : v - Math.sign(v) * dead; }
    sx = cut(sx); sy = cut(sy); sz = cut(sz);
    if (!sx && !sy && !sz) return;
    // 화면 축은 카메라 기준 월드 축과 거의 같음(오른쪽=x, 위=y, 화면 밖=z). 큐브가 돌아간 만큼 큐브 기준으로 바꿈
    _shQ.copy(mesh.quaternion).invert();
    _shV.set(sx, sy, sz).applyQuaternion(_shQ);
    var k = 1.6;                                                // 폰이 움직인 반대쪽으로 늦게 따라옴(관성)
    wob.vx -= _shV.x * k * dt; wob.vz -= _shV.z * k * dt;
    wob.vq += _shV.y * k * 0.8 * dt;                            // 위로 들면 눌려 납작, 내리면 늘어남
    var lim = 0.45;                                             // 너무 세게 흔들어도 형태가 무너지지 않게
    wob.sx = Math.max(-lim, Math.min(lim, wob.sx)); wob.sz = Math.max(-lim, Math.min(lim, wob.sz));
    wob.q = Math.max(-0.35, Math.min(0.35, wob.q));
    if (actx && soundMode === "wet" && Math.abs(wob.vx) + Math.abs(wob.vz) > 1.2 && now - (shake.sndT || 0) > 160) {
      shake.sndT = now; burst(260 + Math.random() * 120, 1.3, 0.1, 0.05);   // 크게 출렁일 때 찰랑 소리
    }
  }
  var glitterBtn = document.getElementById("glitter");
  glitterBtn.addEventListener("click", function () {
    var on = glitterU.value === 0;
    glitterU.value = on ? 1 : 0;
    glitterBtn.setAttribute("aria-pressed", on);
    glitterBtn.textContent = on ? "반짝이 켬" : "반짝이 끔";
  });

  var muteBtn = document.getElementById("mute");
  var SOUNDS = [["wet", "질척"], ["pop", "톡"], ["off", "끔"]];
  var soundIdx = 0;
  muteBtn.addEventListener("click", function () {
    soundIdx = (soundIdx + 1) % SOUNDS.length;
    soundMode = SOUNDS[soundIdx][0];
    muteBtn.textContent = "소리: " + SOUNDS[soundIdx][1];
    if (soundMode !== "off") ensureAudio();
  });

  var moreBtn = document.getElementById("moreBtn"), moreEl = document.getElementById("more");
  function setMore(open) { moreEl.hidden = !open; moreBtn.setAttribute("aria-expanded", String(open)); moreBtn.textContent = open ? "설정 접기" : "설정"; }
  moreBtn.addEventListener("click", function () { setMore(moreEl.hidden); });
  setMore(!(IS_MOBILE || window.innerWidth < 600));
  document.addEventListener("touchend", function () { ensureAudio(); }, { passive: true });     // iOS: 터치가 끝날 때 소리 잠금 해제
  var hint = document.getElementById("hint");
  if (IS_MOBILE) hint.innerHTML = "큐브를 눌러 보세요. 빈 곳을 끌면 돌아가요.<br>두 손가락으로 벌리면 늘어나요. 물슬라임은 '바풍'으로 공기 풍선을 만들어요.";
  function hideHint() { hint.style.opacity = 0; started = true; }
  setTimeout(function () { if (!started) hint.style.opacity = 1; }, 700);

  /* ---------- 크기 / 루프 ---------- */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // 좁은 화면에서는 큐브가 잘리지 않게 카메라를 뒤로
    camera.position.z = w / h < 0.8 ? 3.9 / Math.max(0.55, w / h * 1.3) : 3.9;
    camera.position.z = Math.min(camera.position.z, 7.5) * (w / h < 0.8 ? 0.72 : 0.9);   // 큐브가 화면을 더 채우도록 당김(가로 화면은 당겼을 때 위가 잘리지 않을 만큼만)
    camera.lookAt(0, w / h < 0.8 ? 0.1 : -0.18, 0);              // 세로 화면에서는 큐브를 화면 가운데쯤으로
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (held && held.mode === "press") held.pressure = Math.min(1, held.pressure + dt / 1.5);
    pinchTick();
    // 푸딩 흔들림이 향할 방향: 누르면 반대쪽으로 기울고 납작해짐, 당기면 따라 기울어짐
    if (held) {
      if (held.mode === "press") { var dd = params.depth * (0.45 + 0.55 * (1 - Math.pow(1 - held.pressure, 2))); wob.tx = -held.n.x * dd * 0.35; wob.tz = -held.n.z * dd * 0.35; wob.tq = Math.max(0, held.n.y) * dd * 0.45; }
      else { wob.tx = held.pull.x * 0.25; wob.tz = held.pull.z * 0.25; wob.tq = -held.pull.y * 0.2; }
    } else if (pinch.active) { wob.tx = 0; wob.tz = 0; wob.tq = -pinch.s * 0.12; }
    else { wob.tx = wob.tz = 0; wob.tq = isWater() ? 0.05 : 0; }   // 물슬라임은 가만히 있어도 살짝 퍼져 있음
    domesStep(dt);
    var wobOn = wobbleStep(dt);
    if (held || pinch.active || energy > 0.0004 || wobOn || domes.length) {
      computeTargets();
      step(dt);
      applyToGeometry();
      if (!held && !pinch.active && !domes.length && energy <= 0.0004) {
        disp.fill(0); vel.fill(0); energy = 0;
        applyToGeometry();
      }
    }
    timeU.value = now / 1000;
    mbUpdate(dt);
    updateSound(dt);
    // 눌릴 때 그림자가 살짝 넓어짐
    var s = 1 + Math.min(0.25, energy * 0.9);
    shadow.scale.set(s, s, 1);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  recomputeNormals();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
